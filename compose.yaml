# Production-like stack: Postgres 18, a one-shot migration job, and the web app.
#   (umask 077 && mkdir -p .secrets) && for s in postgres_password db_migrator_password db_app_password; do
#     [ -s .secrets/$s ] || (openssl rand -hex 32 > .secrets/$s && chmod 644 .secrets/$s); done
#   docker compose up --build
# Roles are created from these files on the first start of an empty `pgdata` volume; changing a
# password later needs `alter role ... password` (or `docker compose down -v` to start over).
# The database is only reachable from the stack. For `pnpm dev` on the host, also load compose.dev.yaml.

name: cognitive-wealth

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256

services:
  db:
    <<: *hardening
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    # Run as the image's `postgres` user from the start, so the entrypoint needs no root capabilities.
    user: "70:70"
    environment:
      POSTGRES_DB: cognitive_wealth
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # The default pg_hba.conf trusts socket and loopback connections; require a password for all.
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    secrets: [postgres_password, db_migrator_password, db_app_password]
    volumes:
      # Postgres 18 images keep data in a versioned subdirectory, so mount the parent.
      - pgdata:/var/lib/postgresql
      - ./packages/db/docker/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0775
      - /tmp:uid=70,gid=70,mode=1777
    shm_size: 128mb
    healthcheck:
      test: ["CMD", "pg_isready", "--username=postgres", "--dbname=cognitive_wealth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]
    restart: unless-stopped

  migrate:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://migrator@db:5432/cognitive_wealth
      DATABASE_PASSWORD_FILE: /run/secrets/db_migrator_password
    secrets: [db_migrator_password]
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    restart: "no"

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: web
    environment:
      DATABASE_URL: postgres://app@db:5432/cognitive_wealth
      DATABASE_PASSWORD_FILE: /run/secrets/db_app_password
    secrets: [db_app_password]
    tmpfs:
      - /app/apps/web/.next/cache:uid=65532,gid=65532,mode=0700
      - /tmp:uid=65532,gid=65532,mode=1777
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [edge, data]
    restart: unless-stopped

networks:
  # No route out of this network: Postgres can't reach the internet, and only the stack reaches it.
  data:
    internal: true
  edge: {}

volumes:
  pgdata:

# Mounted read-only at /run/secrets/<name>, so passwords never enter an env var or `docker inspect`.
# The directory is private (0700); the files must be world-readable for the containers' users.
secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  db_migrator_password:
    file: ./.secrets/db_migrator_password
  db_app_password:
    file: ./.secrets/db_app_password
