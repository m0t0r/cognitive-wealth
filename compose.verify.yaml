# Throwaway backing services for runtime verification (`.claude/skills/verifier-web`) and for
# `pnpm dev` in a git worktree (`packages/dev-env`): their own Compose project, ports and in-memory
# storage, so neither ever touches the dev stack's data. A worktree gets a database `wt_<token>`
# and the Redis prefix `cw:wt:<token>:`, which `pnpm dev:teardown` removes.
#   docker compose -f compose.yaml -f compose.verify.yaml up -d --wait db redis mailpit
# Postgres on 127.0.0.1:5433, Redis on :6380, Mailpit SMTP on :1026 and UI/API on :8026. Each
# verification server gets a fresh database cloned from the empty `cognitive_wealth` (which carries
# the roles' schema grant and sequence defaults; tables are granted by migrations) and its own Redis
# key prefix, so runs never see each other's data.
# Stop with `docker compose -f compose.yaml -f compose.verify.yaml down`; nothing persists.

name: cognitive-wealth-verify

services:
  db:
    # Disposable data: in memory, without durability work.
    command: [postgres, -c, fsync=off, -c, synchronous_commit=off, -c, full_page_writes=off]
    volumes: !override
      - ./packages/db/docker/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs: !override
      - /var/lib/postgresql:uid=70,gid=70,mode=0700
      - /var/run/postgresql:uid=70,gid=70,mode=0775
      - /tmp:uid=70,gid=70,mode=1777
    ports: !override
      - "127.0.0.1:5433:5432"
    networks: [data, host-access]

  redis:
    ports: !override
      - "127.0.0.1:6380:6379"
    networks: [data, host-access]
    # Adds the `janitor` user (SCAN and DEL on `cw:*`), which `pnpm dev:teardown` and `dev:prune`
    # delete a worktree's keys with.
    secrets: !override [redis_password, redis_janitor_password]

  mailpit:
    ports: !override
      - "127.0.0.1:8026:8025"
      - "127.0.0.1:1026:1025"

networks:
  host-access: {}

secrets:
  # The app's password, reused: this stack is throwaway, on loopback and in memory, so a separate
  # secret wouldn't protect anything, and reusing it means `.secrets/` needs no new file.
  redis_janitor_password:
    file: ./.secrets/redis_password
