[project]
name = "custodian"
version = "0.0.0"
description = "Simulated custodian: the book of record for holdings (ADR 0009, 0011)."
requires-python = ">=3.15,<3.16"
dependencies = ["fastapi>=0.162.0", "pydantic>=2.14.1,<3", "uvicorn>=0.54.0"]

[dependency-groups]
dev = ["httpx2>=2.16.0", "pyright>=1.1.414", "pytest>=9.1.1", "ruff>=0.17.2"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort: import order
  "B", # bugbear: likely bugs
  "UP", # pyupgrade: modern syntax for the pinned Python
  "SIM", # simplifications
  "ANN", # every function is annotated
  "ASYNC",
  "RUF",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.15"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
