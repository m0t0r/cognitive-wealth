# Version updates. Security updates are separate: GitHub opens those PRs as soon as an advisory
# lands, ignoring the schedule, cooldown and ignore rules below.
version: 2

updates:
  # Every workspace package (apps/*, packages/*) shares the root pnpm lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Supply-chain buffer: skip releases younger than this, giving the registry time to pull bad ones.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    groups:
      # Majors stay one PR per package so breaking changes get their own review.
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  # Base images are pinned as tag@digest; Dependabot moves both, including digest-only rebuilds
  # (e.g. distroless `nonroot` or a Debian security patch under the same Node tag).
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    # Dependabot's own default is 3 days; zizmor's dependabot-cooldown asks for 7, as for npm.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(docker)"
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Node majors move with the LTS line on purpose, not automatically.
      - dependency-name: node
        update-types: [version-update:semver-major]

  # The custodian's Python dependencies (pyproject.toml floors, uv.lock pins).
  - package-ecosystem: uv
    directory: /apps/custodian
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "build(deps)"
    groups:
      # Groups can't split by dependency type for uv, so runtime and dev dependencies share one.
      # Majors stay one PR per package, as for npm.
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  # The workflow linters `pnpm lint` runs (actionlint, its shellcheck, zizmor), pinned in uv.lock.
  - package-ecosystem: uv
    directory: /packages/workflow-lint
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "build(deps)"
    groups:
      linters:
        patterns: ["*"]

  # The custodian's base images and uv's, pinned the same way.
  - package-ecosystem: docker
    directory: /apps/custodian
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(docker)"
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # A Python minor (3.15 → 3.16) moves on purpose, with `.python-version` and `requires-python`
      # (apps/custodian/CLAUDE.md, "Version policy").
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  # Testcontainers' reaper (Ryuk): a never-built Dockerfile that both test harnesses read
  # (`reaperImage()` in @repo/testing, `reaper_image()` in the custodian's tests). A bump changes
  # what runs beside every test container: check it with `pnpm test:integration` and `pnpm e2e`.
  - package-ecosystem: docker
    directory: /docker/testcontainers
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(docker)"

  # The workflows' actions, pinned by commit SHA (`.github/workflows/cve-now.yml`).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(actions)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(docker)"
    ignore:
      # A Postgres major needs pg_upgrade or a dump/restore of the data volume.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
