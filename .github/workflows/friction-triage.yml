# Sorts each new friction report (docs/agents/friction.md) as soon as it's filed, with
# `pnpm cw friction triage` (packages/cli/src/commands/friction.ts): Haiku reads the report beside
# the open ones and CLAUDE.md, and only answers; the command then labels, comments or closes.
# `ready-for-agent` reports are picked up by friction-fix.yml, which a `ready-for-agent` decision
# dispatches. To see what it would decide for a report, run `pnpm cw friction triage <number> --dry-run` (with ANTHROPIC_API_KEY set).
name: Friction triage

on:
  issues:
    # An issue filed with the label fires `labeled` too, so `opened` isn't needed.
    types: [labeled]
  # By hand, from Actions: a report filed with a workflow's token fires no `labeled` event, and a
  # human may want one triaged again (it passes --retriage, so the new label replaces the old).
  workflow_dispatch:
    inputs:
      issue:
        description: "The friction report's issue number"
        required: true
        type: number

permissions:
  contents: read
  issues: write
  # To dispatch friction-fix.yml once a report is ready-for-agent.
  actions: write

concurrency:
  group: friction-triage-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.label.name == 'friction' && github.event.issue.state == 'open')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Only `cw`'s runtime dependencies (incur, the AI SDK, Zod and the database packages it loads).
      - run: pnpm install --frozen-lockfile --prod --filter "@repo/cli..."

      # One Haiku request through the AI SDK: a plain API call, which the promotional credit covers,
      # where Claude Code's weren't. A report that already has a triage label is left as it is
      # (`status: already_triaged`), so a re-label doesn't re-triage. Only comments from people with
      # write access reach the model: anyone can comment on a public issue.
      - name: Triage with Haiku
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          RETRIAGE: ${{ github.event_name == 'workflow_dispatch' && '--retriage' || '' }}
        id: triage
        # $RETRIAGE is empty or one flag, split on purpose.
        # shellcheck disable=SC2086
        run: |
          node packages/cli/src/cli.ts friction triage "$ISSUE" $RETRIAGE --json \
            > "$RUNNER_TEMP/triage.json" || { cat "$RUNNER_TEMP/triage.json"; exit 1; }
          cat "$RUNNER_TEMP/triage.json"
          echo "decision=$(jq -r '.decision // empty' "$RUNNER_TEMP/triage.json")" >> "$GITHUB_OUTPUT"

      # A report just labelled `ready-for-agent` asks friction-fix.yml to look now, rather than
      # leaving it to the schedule, which GitHub runs best-effort and may skip. `force=false` keeps
      # the fix job's batching rule (MIN_READY, MAX_WAIT_HOURS). A dispatch is the one event this
      # job's token can start a workflow with.
      - name: Ask friction-fix.yml to look
        if: steps.triage.outputs.decision == 'ready-for-agent'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
        run: gh workflow run friction-fix.yml --ref "$REF" -f force=false
